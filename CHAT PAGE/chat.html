<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9C8DE8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" "default">
    <meta name="apple-mobile-web-app-title" content="SHREE WIN">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../LOGO/images__1_-removebg-preview.png">
    <title>ONLINE CHAT</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- PRELOADER -->
    <div class="preloader" id="preloader">
        <img src="../LOGO/images__1_-removebg-preview.png" alt="Logo">
    </div>

    <!-- MOBILE MENU OVERLAY -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="sidebar" id="sidebar">
            <button class="close-btn" onclick="toggleMenu()">✕</button>
            <div class="sidebar-logo">
                <img src="../LOGO/images__1_-removebg-preview.png" alt="Logo">
            </div>
            <a href="../index.html" class="sidebar-item">
                <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>HOME</span>
                <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>
            <a href="../contact.html" class="sidebar-item">
                <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                <span>MAIL BOX</span>
                <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>
            <a href="../deposite.html" class="sidebar-item">
                <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                <span>DEPOSITE</span>
                <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>
            <a href="../withdrawal.html" class="sidebar-item">
                <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                <span>WITHDRAWAL</span>
                <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <button class="menu-btn" id="menuBtn" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="logo">
                <a href="../index.html">
                    <img src="../LOGO/images__1_-removebg-preview.png" alt="Logo">
                </a>
            </div>
        </div>
    </nav>

    <!-- VERIFICATION OVERLAY -->
    <div class="verify-overlay" id="verifyOverlay">
        <div class="verify-box">
            <div class="verify-logo">
                <img src="../LOGO/images__1_-removebg-preview.png" alt="Logo">
            </div>
            <h2>🔒 Verify Your Identity</h2>
            <p>Please enter your details to access the chat</p>
            <form id="verifyForm">
                <div class="form-group">
                    <label for="vName">User Name</label>
                    <input type="text" id="vName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="vMobile">Mobile Number</label>
                    <input type="tel" id="vMobile" placeholder="Enter mobile number" required>
                </div>
                <div class="form-group">
                    <label for="vPassword">Game Account Password</label>
                    <input type="password" id="vPassword" placeholder="Enter game password" required>
                </div>
                <div class="form-group">
                    <label for="vEmail">Email ID</label>
                    <input type="email" id="vEmail" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="btn">Next →</button>
            </form>
        </div>
    </div>

    <!-- CHAT APP - Full Page Layout -->
    <div class="chat-fullpage" id="chatFullpage" style="display:none">
        <!-- CHAT HEADER -->
        <header class="chat-header">
            <div class="chat-header-left">
                <button class="back-btn" onclick="window.location.href='../index.html'">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <div class="chat-avatar">SW</div>
                <div class="chat-user-info">
                    <h3>SHREE WIN SUPPORT</h3>
                    <span class="online-status">● Online</span>
                </div>
            </div>
            <div class="chat-header-right">
                <button class="header-action-btn" onclick="openChatInfo()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                </button>
            </div>
        </header>

        <!-- MESSAGES AREA -->
        <main class="chat-messages-area" id="chatMessagesArea">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-welcome">
                    <p>Welcome to SHREE WIN GAME Support Chat</p>
                    <span>Send a message to start the conversation</span>
                </div>
            </main>

            <!-- TYPING INDICATOR -->
            <div class="typing-indicator" id="typingIndicator" style="display:none">
                <span></span><span></span><span></span>
            </div>

        </main>

        <!-- CHAT INPUT BAR -->
        <footer class="chat-input-bar">
            <label class="input-action-btn" title="Send Image">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <input type="file" id="imageInput" accept="image/*" onchange="sendImage()" style="display:none">
            </label>
            <label class="input-action-btn" title="Send PDF/Files">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt,.xls,.xlsx,.zip,.rar" onchange="sendFile()" style="display:none">
            </label>
            <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button class="send-btn" onclick="sendMessage()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </footer>
    </div>

    <!-- CHAT INFO POPUP -->
    <div class="popup-overlay" id="chatInfoPopup" onclick="closeChatInfo()">
        <div class="popup-box chat-info-box">
            <div class="chat-info-header">
                <div class="chat-avatar-large">SW</div>
                <div class="chat-info-title">
                    <h3>SHREE WIN SUPPORT</h3>
                    <span class="online-status">● Online</span>
                </div>
            </div>
            <div class="chat-info-actions">
                <button class="info-action-btn" onclick="openChatMedia()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    <span>Media & Files</span>
                </button>
                <button class="info-action-btn" onclick="openChatSearch()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
                    <span>Search</span>
                </button>
                <button class="info-action-btn danger" onclick="clearChatHistory()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    <span>Clear Chat</span>
                </button>
            </div>
            <button class="popup-close-btn" onclick="closeChatInfo()">Close</button>
        </div>
    </div>

    <!-- CHAT DETAIL POPUP -->
    <div class="popup-overlay" id="chatPopup">
        <div class="popup-box chat-popup-box">
            <h3>MESSAGE DETAILS</h3>
            <div class="chat-detail-content" id="chatDetailContent"></div>
            <button class="btn" onclick="closeChatPopup()">Close</button>
        </div>
    </div>

    <!-- EDIT POPUP -->
    <div class="popup-overlay" id="editPopup">
        <div class="popup-box chat-popup-box">
            <h3>EDIT MESSAGE</h3>
            <input type="text" class="edit-input" id="editInput" placeholder="Edit your message..." onkeypress="if(event.key==='Enter')saveEdit()">
            <div class="popup-actions">
                <button class="btn" onclick="saveEdit()">Save</button>
                <button class="btn btn-secondary" onclick="closeEditPopup()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- IMAGE VIEWER -->
    <div class="image-viewer-overlay" id="imageViewer" onclick="closeImageViewer()">
        <span class="image-viewer-close" onclick="event.stopPropagation(); closeImageViewer()">✕</span>
        <div class="image-viewer-toolbar">
            <span class="image-viewer-info" id="imageViewerInfo"></span>
            <a class="image-viewer-download" id="imageViewerDownload" download>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </a>
        </div>
        <img id="imageViewerImg" src="" alt="Fullscreen image">
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../script.js"></script>
    <script src="chat.js"></script>
</body>
</html>
